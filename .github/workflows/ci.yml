name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev,contract,property,inspect,otel]"

      - name: Run test suite
        run: python -m pytest -o addopts="" -q

      - name: Lint
        run: ruff check . --no-cache

      - name: Type check
        run: mypy src

      - name: Check installed dependencies
        run: python -m pip check

      - name: Import smoke test
        run: python -c "import redfence"

      - name: Validate the example contract
        run: redfence contract validate examples/contracts/mock.json

      - name: Run the example contract against the mock adapter
        run: redfence contract test examples/contracts/mock.json --adapter mock --out reports/contract-demo

      - name: Mutation self-test (no score threshold)
        run: python scripts/run_mutation.py

      - name: Property tests
        run: python -m pytest -m property -q
