[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfence"
version = "0.3.0"
description = "Stateful enterprise AI security evaluation: RedFenceBench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RedFence Contributors" }]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
contract = [
    "PyYAML>=6.0",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
inspect = [
    "inspect-ai>=0.3",
]
otel = [
    "opentelemetry-api>=1.20",
]
property = [
    "hypothesis>=6",
]

[project.scripts]
redfence = "redfence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redfence"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "deterministic: tests that must be bit-reproducible across runs",
    "integration: tests that touch the filesystem or optional infrastructure",
    "property: optional Hypothesis-backed property tests (requires the property extra)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".prior-art",
    ".prior-art-clones",
    ".venv",
    ".verify",
    "reports",
    "runs",
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
